
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjetas de Combustible · PYLSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#1B2024; --bg-panel:#232A2F; --bg-panel-2:#2B3239; --bg-raised:#323A41;
    --accent-amber:#E8A93B; --accent-amber-dim:#4A3B22;
    --accent-teal:#4FA6A0; --accent-teal-dim:#1F3735;
    --accent-red:#D9614F; --accent-red-dim:#3E2420;
    --text-primary:#ECEEEA; --text-muted:#97A0A6; --text-faint:#5E666C;
    --border:#3A4249; --border-light:#454E56;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg-base);color:var(--text-primary);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:120px;}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px;}
 
  header{background:linear-gradient(180deg,#20262B 0%,#1B2024 100%);border-bottom:1px solid var(--border);padding:28px 0 22px;position:relative;overflow:hidden;}
  header::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(135deg,var(--accent-amber) 0 14px,#1B2024 14px 28px);opacity:.55;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;}
  .eyebrow button{background:none;border:none;color:var(--accent-teal);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;text-decoration:underline;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(28px,7vw,40px);letter-spacing:.01em;text-transform:uppercase;margin:0 0 6px;line-height:1.02;}
  .subhead{color:var(--text-muted);font-size:14.5px;line-height:1.5;max-width:56ch;}
  .warn{margin-top:12px;font-size:13px;line-height:1.5;color:var(--accent-amber);background:var(--accent-amber-dim);border:1px solid var(--accent-amber);border-radius:7px;padding:9px 12px;}
  .progress-row{display:flex;align-items:center;gap:12px;margin-top:20px;}
  .progress-track{flex:1;height:6px;border-radius:3px;background:var(--bg-panel-2);overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:var(--accent-teal);width:0%;transition:width .25s ease;}
  .progress-label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-muted);white-space:nowrap;}
 
  .section-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.02em;margin:26px 0 4px;}
  .section-note{color:var(--text-muted);font-size:13px;margin:0 0 12px;}
  .units{padding:10px 0 8px;display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:16px 16px 18px;transition:border-color .2s ease,background .2s ease;}
  .card.is-ok{border-color:var(--accent-teal);background:linear-gradient(180deg,var(--bg-panel) 0%,var(--accent-teal-dim) 340%);}
  .card.is-vacante{border-color:var(--accent-amber);}
  .card.is-error{border-color:var(--accent-red);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .veh-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.01em;}
  .veh-modelo{color:var(--text-muted);font-size:12.5px;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#D8DCDD;background:linear-gradient(180deg,#3D454C,#2A3136);border:1px solid #4B545C;border-radius:5px;padding:5px 9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 2px rgba(0,0,0,.35),0 1px 0 rgba(0,0,0,.3);position:relative;white-space:nowrap;}
  .tag::before,.tag::after{content:"";position:absolute;top:50%;width:3px;height:3px;border-radius:50%;background:#1B2024;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);transform:translateY(-50%);}
  .tag::before{left:4px;} .tag::after{right:4px;}
  .tag span{padding:0 6px;}
  .eco-big{font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--accent-amber);margin-top:6px;letter-spacing:.02em;}
  .eco-big small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px;}
  .steps{margin:24px 0 0;padding:0;list-style:none;counter-reset:paso;display:flex;flex-direction:column;gap:12px;}
  .steps li{counter-increment:paso;position:relative;background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px 14px 56px;font-size:15px;line-height:1.55;color:var(--text-muted);}
  .steps li b{color:var(--text-primary);}
  .steps li::before{content:counter(paso);position:absolute;left:16px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--accent-amber);color:#2A1D08;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .alert{margin-top:18px;background:var(--accent-red-dim);border:2px solid var(--accent-red);border-radius:10px;padding:16px;font-size:15.5px;line-height:1.55;color:#F3D4CE;}
  .alert b{color:#fff;}
  .alert-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;color:var(--accent-red);margin-bottom:6px;letter-spacing:.02em;}
  .agree{display:flex;gap:12px;align-items:flex-start;margin:22px 0 16px;font-size:15px;line-height:1.5;cursor:pointer;}
  .agree input{width:24px;height:24px;flex-shrink:0;accent-color:var(--accent-teal);margin-top:1px;}
  .agree-btn{width:100%;padding:16px;font-size:18px;margin-bottom:30px;}
  .ex-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px;align-items:start;}
  .ex-grid figure{margin:0;}
  .ex-img svg{width:100%;height:auto;display:block;}
  .ex-img.ex-v svg{max-width:190px;margin:0 auto;}
  .ex-grid figcaption{font-size:13.5px;line-height:1.45;margin-top:8px;color:var(--text-muted);}
  .ctype-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ctype{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg-panel-2);border:2px solid var(--border-light);border-radius:9px;padding:10px;cursor:pointer;color:var(--text-muted);font-family:'Inter',sans-serif;}
  .ctype-img{display:flex;align-items:center;justify-content:center;height:84px;}
  .ctype-img svg{height:84px;width:auto;}
  .ctype-txt{display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.3;}
  .ctype-txt b{color:var(--text-primary);font-size:14px;}
  .ctype-txt small{font-size:11.5px;color:var(--text-faint);}
  .ctype.active{border-color:var(--accent-teal);background:var(--accent-teal-dim);}
  .ctype.active .ctype-txt b{color:var(--accent-teal);}
  @media (max-width:520px){.ex-grid{grid-template-columns:1fr;}}
  .row-line{display:flex;gap:8px;font-size:13px;color:var(--text-muted);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .row-line b{color:var(--text-primary);font-weight:600;}
  .row-line b.pend{color:var(--accent-amber);}
 
  .field-group{margin-top:14px;}
  .field-label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:7px;font-weight:600;}
  .seg{display:flex;border:1px solid var(--border-light);border-radius:7px;overflow:hidden;}
  .seg button{flex:1;background:var(--bg-panel-2);color:var(--text-muted);border:none;padding:9px 8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,color .15s;}
  .seg button + button{border-left:1px solid var(--border-light);}
  .seg button.active.ok{background:var(--accent-teal);color:#0F1E1C;}
  .seg button.active.change{background:var(--accent-amber);color:#2A1D08;}
  .reveal{display:none;} .reveal.show{display:block;}
 
  input[type="text"],select,textarea{width:100%;background:var(--bg-panel-2);border:1px solid var(--border-light);border-radius:7px;padding:10px 12px;color:var(--text-primary);font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.03em;}
  select{font-family:'Inter',sans-serif;}
  textarea{font-family:'Inter',sans-serif;letter-spacing:0;min-height:60px;resize:vertical;}
  input::placeholder,textarea::placeholder{color:var(--text-faint);font-family:'Inter',sans-serif;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-teal);outline-offset:0;border-color:var(--accent-teal);}
  input.card-num{font-size:18px;letter-spacing:.12em;}
  input.bad{border-color:var(--accent-red);}
  .hint{font-size:12px;color:var(--text-faint);margin-top:5px;font-family:'IBM Plex Mono',monospace;}
  .hint.err{color:var(--accent-red);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
 
  .photo-row{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .photo-btn{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;background:var(--bg-panel-2);color:var(--text-muted);border:1px dashed var(--border-light);border-radius:7px;padding:10px 14px;cursor:pointer;}
  .photo-btn.has{border-style:solid;border-color:var(--accent-teal);color:var(--accent-teal);}
  .photo-row input[type=file]{display:none;}
  .thumb{width:70px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--border-light);display:none;}
  .thumb.show{display:block;}
 
  .add-btn{width:100%;background:transparent;border:1px dashed var(--border-light);color:var(--text-muted);border-radius:10px;padding:14px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;}
  .add-btn:hover{border-color:var(--accent-teal);color:var(--accent-teal);}
  .remove-btn{background:none;border:none;color:var(--accent-red);font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;padding:4px;}
 
  .footer-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(27,32,36,.92);backdrop-filter:blur(6px);border-top:1px solid var(--border);padding:14px 18px calc(14px + env(safe-area-inset-bottom));}
  .footer-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  .footer-status{font-size:12.5px;color:var(--text-muted);flex:1;font-family:'IBM Plex Mono',monospace;}
  .submit-btn{background:var(--accent-teal);color:#0F1E1C;border:none;border-radius:8px;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase;padding:13px 22px;cursor:pointer;transition:opacity .15s,transform .1s;}
  .submit-btn:disabled{opacity:.4;cursor:not-allowed;}
  .submit-btn:not(:disabled):active{transform:scale(.98);}
 
  .center-screen{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;}
  .center-screen h1{font-size:28px;}
  .center-screen p{color:var(--text-muted);max-width:44ch;margin:10px 0 26px;line-height:1.6;}
  .branch-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;}
  .branch-list a{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text-primary);text-decoration:none;font-size:14px;font-weight:600;cursor:pointer;}
  .branch-list a:hover{border-color:var(--accent-teal);}
  .branch-list a span{color:var(--text-faint);font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:12px;}
  .ok-icon{width:64px;height:64px;border-radius:50%;background:var(--accent-teal-dim);border:2px solid var(--accent-teal);display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .summary{width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:4px 16px;text-align:left;}
  .summary div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--text-muted);}
  .summary div:last-child{border:none;}
  .summary b{color:var(--text-primary);font-family:'IBM Plex Mono',monospace;}
  .err-banner{background:var(--accent-amber-dim);border:1px solid var(--accent-amber);color:var(--accent-amber);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:12px;text-align:left;line-height:1.5;max-width:720px;margin-left:auto;margin-right:auto;}
  @media (max-width:440px){.two{grid-template-columns:1fr;}}
</style>
</head>

const OK = '#2E9E8F', NO = '#D9614F';
function bars(x, y, w, h){
  let out = '', cx = x, i = 0;
  const pat = [2,1,1,3,1,2,2,1,3,1,1,2,1,1,2,3,1,2,1,1];
  while (cx < x + w){ const bw = pat[i % pat.length]; if (i % 2 === 0) out += `<rect x="${cx}" y="${y}" width="${bw}" height="${h}" fill="#111"/>`; cx += bw + 1; i++; }
  return out;
}
function qr(x, y, s){
  const c = s / 7;
  const finder = (fx, fy) => `<rect x="${fx}" y="${fy}" width="${c*2}" height="${c*2}" fill="none" stroke="#111" stroke-width="${c*0.45}"/><rect x="${fx+c*0.65}" y="${fy+c*0.65}" width="${c*0.7}" height="${c*0.7}" fill="#111"/>`;
  let dots = '';
  [[3,0],[3,2],[4,1],[0,3],[2,3],[3,3],[5,3],[6,4],[3,4],[4,5],[3,6],[5,5],[6,6],[4,3],[2,4]].forEach(([a,b]) => dots += `<rect x="${x+a*c}" y="${y+b*c}" width="${c}" height="${c}" fill="#111"/>`);
  return finder(x, y) + finder(x + c*5, y) + finder(x, y + c*5) + dots;
}

        <div class="two field-group">

          <div><div class="field-label">Número de serie</div><input type="text" data-f="serie" placeholder="Viene en la placa del equipo" autocomplete="off"><div class="hint" data-hint="serie"></div></div>
        </div>`;
  }
 
  function buildCard(s){
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + s.key;
    if (s.origen === 'LISTADA') {
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="veh-name">${esc(s.tipo)}</div>
            <div class="eco-big"><small>Económico</small>U-${esc(s.eco)}</div>
          </div>
        </div>
        <div class="row-line">PLACA&nbsp;${s.placa ? `<b>${esc(s.placa)}</b>` : `<b class="pend">PENDIENTE</b>`}</div>
        ${s.placa ? '' : `<div class="field-group"><div class="field-label">Placa (si ya la tiene)</div><input type="text" data-f="placa_nueva" placeholder="Opcional" autocomplete="off"></div>`}
        ${tarjetaBlock(s)}`;
    } else if (s.origen === 'ESPECIAL') {
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="veh-name">${esc(s.tipo)}</div>
            <div class="veh-modelo">${esc(s.modelo || (ES_MC(s.tipo) ? 'Sin económico ni placa' : 'Sin número económico registrado'))}</div>
          </div>
          <div class="tag"><span>${ES_MC(s.tipo) ? 'MONTACARGAS' : 'UTILITARIO'}</span></div>
        </div>
        ${ES_MC(s.tipo) ? mcFields() : `
        <div class="two">
          <div><div class="field-label">No. económico (si tiene)</div><input type="text" data-f="eco" placeholder="Opcional" autocomplete="off"><div class="hint" data-hint="eco"></div></div>
          <div><div class="field-label">Placa (si tiene)</div><input type="text" data-f="placa" placeholder="Opcional" autocomplete="off"></div>
        </div>`}
        ${tarjetaBlock(s)}`;
    } else {
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="veh-name">Unidad no listada</div>
            <div class="veh-modelo">Se revisará antes de darla de alta</div>
          </div>
          <button type="button" class="remove-btn" data-f="remove">Quitar</button>
        </div>
        <div><div class="field-label">Tipo</div><select data-f="tipo"><option value="">Elegir…</option>${TIPOS.map(t => `<option>${t}</option>`).join('')}</select></div>
        <div data-f="stdBlock">
          <div class="two field-group">
            <div><div class="field-label" data-f="ecoLabel">No. económico</div><input type="text" data-f="eco" placeholder="Ej. 340" autocomplete="off"><div class="hint" data-hint="eco"></div></div>
            <div><div class="field-label" data-f="placaLabel">Placa</div><input type="text" data-f="placa" placeholder="Ej. XR5288B" autocomplete="off"></div>
          </div>
        </div>
        <div data-f="marcaBlock" class="reveal">
          <div class="two field-group">
            <div><div class="field-label">Marca</div><input type="text" data-f="marca" placeholder="Ej. CHEVROLET" autocomplete="off"></div>
            <div data-f="serieBlock" class="reveal"><div class="field-label">Número de serie</div><input type="text" data-f="serie" placeholder="Viene en la placa del equipo" autocomplete="off"><div class="hint" data-hint="serie"></div></div>
          </div>
        </div>
        ${tarjetaBlock(s)}
        <div class="field-group"><div class="field-label">¿De dónde viene esta unidad?</div><textarea data-f="comentario" placeholder="Opcional. Ej. la prestó Matriz en septiembre"></textarea></div>`;
    }
    wireCard(card, s);
    return card;
  }
 
  function wireCard(card, s){
    const q = f => card.querySelector(`[data-f="${f}"]`);
    const upper = el => el && el.addEventListener('input', () => { el.value = el.value.toUpperCase().replace(/[\s-]/g, ''); });
    const wireMc = () => {
      const marca = q('marca'), serie = q('serie');
      if (!marca) return;
      marca.addEventListener('input', () => { marca.value = marca.value.toUpperCase(); s.marca = marca.value.trim(); check(); });
      upper(serie);
      serie.addEventListener('input', () => { s.serie = serie.value; check(); });
    };
 
    if (s.origen === 'LISTADA') {
      const pn = q('placa_nueva');
      if (pn) { upper(pn); pn.addEventListener('input', () => { s.placa_nueva = pn.value; }); }
    } else if (s.origen === 'ESPECIAL') {
      wireMc();
      const eco = q('eco'), placa = q('placa');
      if (eco) { upper(eco); eco.addEventListener('input', () => { s.eco = eco.value; check(); }); }
      if (placa) { upper(placa); placa.addEventListener('input', () => { s.placa = placa.value; }); }
    } else {
      wireMc();
      const eco = q('eco'), tipo = q('tipo'), placa = q('placa'), com = q('comentario');
      upper(eco); upper(placa);
      eco.addEventListener('input', () => { s.eco = eco.value; check(); });
      tipo.addEventListener('change', () => {
        s.tipo = tipo.value;
        const mc = ES_MC(s.tipo);
        q('stdBlock').classList.toggle('reveal', mc);
        const auto = s.tipo === 'AUTO UTILITARIO';
        q('marcaBlock').classList.toggle('show', mc || auto);
        q('serieBlock').classList.toggle('show', mc);
        q('marca').placeholder = mc ? 'Ej. YALE' : 'Ej. CHEVROLET';
        if (mc) { s.eco = ''; eco.value = ''; s.placa = ''; placa.value = ''; }
        if (!mc) { s.serie = ''; q('serie').value = ''; }
        if (!mc && !auto) { s.marca = ''; q('marca').value = ''; }
        const opc = SIN_ECO.includes(s.tipo);
        q('ecoLabel').textContent = opc ? 'No. económico (si tiene)' : 'No. económico';
        q('placaLabel').textContent = opc ? 'Placa (si tiene)' : 'Placa';
        eco.placeholder = opc ? 'Opcional' : 'Ej. 340';
        check();
      });
      placa.addEventListener('input', () => { s.placa = placa.value; });
      com.addEventListener('input', () => { s.comentario = com.value; });
      q('remove').addEventListener('click', () => {
        state.splice(state.indexOf(s), 1);
        card.remove(); updateProgress();
      });
    }
 
    card.querySelectorAll('.ctype').forEach(b => b.addEventListener('click', () => {
      s.ctipo = b.dataset.ctype;
      const def = TIPOS_TARJETA[s.ctipo];
      card.querySelectorAll('.ctype').forEach(o => o.classList.toggle('active', o === b));
      q('numBlock').classList.add('show');
      q('numLabel').textContent = def.label;
      q('ayuda').textContent = def.ayuda;
      q('tarjeta').setAttribute('inputmode', def.inputmode);
      q('tarjeta').maxLength = def.max + Math.floor((def.max - 1) / 4);
      q('tarjeta').dispatchEvent(new Event('input'));
      q('tarjeta').focus();
      check();
    }));
    const tj = q('tarjeta');
    tj.addEventListener('input', () => {
      const def = TIPOS_TARJETA[s.ctipo] || { max: 20, soloNumeros: false };
      const limpio = def.soloNumeros ? tj.value.replace(/\D/g, '') : tj.value;
      tj.value = fmtCard(limpio, def.max); s.tarjeta = digits(tj.value); check();
    });
 
    const file = q('foto');
    file.addEventListener('change', async () => {
      const f = file.files[0]; if (!f) return;
      const btn = q('fotoBtn');
      btn.firstChild.textContent = 'Procesando…';
      try {
        s.foto = await compress(f);
        const th = q('thumb'); th.src = URL.createObjectURL(s.foto); th.classList.add('show');
        btn.classList.add('has'); btn.firstChild.textContent = 'Foto lista · cambiar';
      } catch(e) {
        btn.firstChild.textContent = 'Tomar o subir foto de la tarjeta';
        alert('No se pudo leer la imagen. Intenta tomar la foto de nuevo.');
      }
      check();
    });
  }
 
  function compress(file){
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', 0.82);
      };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
 
  /* Revisión: una unidad queda lista cuando tiene tipo de tarjeta, número válido + foto,
     sin repetir tarjeta ni económico */
  function evaluate(){
    const porTarjeta = {}, porEco = {}, porSerie = {};
    const nombre = o => o.eco ? 'U-' + o.eco : (o.serie ? 'serie ' + o.serie : o.tipo.toLowerCase() || 'agregada');
    state.forEach(s => {
      if (largoOk(s)) (porTarjeta[s.tarjeta] = porTarjeta[s.tarjeta] || []).push(s);
      if (s.eco) (porEco[s.eco] = porEco[s.eco] || []).push(s);
      if (ES_MC(s.tipo) && s.serie) (porSerie[s.serie] = porSerie[s.serie] || []).push(s);
    });
    state.forEach(s => {
      s.dupTarjeta = largoOk(s) && porTarjeta[s.tarjeta].length > 1
        ? porTarjeta[s.tarjeta].filter(o => o !== s).map(nombre) : null;
      s.dupSerie = ES_MC(s.tipo) && s.serie && porSerie[s.serie].length > 1;
      s.dupEco = s.origen !== 'LISTADA' && s.eco && porEco[s.eco].length > 1;
      let datosExtra;
      if (s.origen === 'LISTADA') datosExtra = true;
      else if (ES_MC(s.tipo)) datosExtra = s.marca && s.serie && !s.dupSerie;
      else if (s.origen === 'ESPECIAL') datosExtra = !s.dupEco;
      else if (s.tipo === 'AUTO UTILITARIO') datosExtra = s.marca && !s.dupEco;
      else datosExtra = s.tipo && (s.eco || SIN_ECO.includes(s.tipo)) && !s.dupEco;
      s.reviewed = !!datosExtra && largoOk(s) && !!s.foto && !s.dupTarjeta;
    });
  }
 
  function check(){
    evaluate();
    state.forEach(s => {
      const card = document.getElementById('card-' + s.key); if (!card) return;
      card.classList.toggle('is-ok', s.reviewed);
      card.classList.toggle('is-error', !!s.dupTarjeta || !!s.dupEco || !!s.dupSerie);
      const h = card.querySelector('[data-hint="tarjeta"]'), tj = card.querySelector('[data-f="tarjeta"]');
      if (h) {
        let msg = '', err = false;
        if (s.dupTarjeta) { msg = `Esta tarjeta ya está en la unidad ${s.dupTarjeta.join(', ')}. Cada tarjeta es de una sola unidad.`; err = true; }
        else if (s.tarjeta.length > 0 && !largoOk(s)) msg = s.ctipo === 'TICKETCAR'
          ? `Faltan ${16 - s.tarjeta.length} dígitos. Este número tiene 16.`
          : 'El número parece incompleto. Revisa que copiaste todo el No. Fleet.';
        else if (largoOk(s) && !s.foto) msg = 'Falta la foto de la tarjeta';
        h.textContent = msg; h.classList.toggle('err', err); tj.classList.toggle('bad', err);
      }
      const he = card.querySelector('[data-hint="eco"]');
      if (he) { he.textContent = s.dupEco ? 'Este económico ya está en la lista' : ''; he.classList.toggle('err', !!s.dupEco); }
      const hs = card.querySelector('[data-hint="serie"]');
      if (hs) { hs.textContent = s.dupSerie ? 'Este número de serie ya está en la lista' : ''; hs.classList.toggle('err', !!s.dupSerie); }
    });
    updateProgress();
  }
 
  function updateProgress(){
    evaluate();
    const total = state.length, done = state.filter(s => s.reviewed).length;
    document.getElementById('progressFill').style.width = (total ? done / total * 100 : 0) + '%';
    document.getElementById('progressLabel').textContent = `${done} / ${total}`;
    document.getElementById('footerStatus').textContent = done < total
      ? `Faltan ${total - done} unidad(es) por completar`
      : 'Todas las unidades completas';
    document.getElementById('submitBtn').disabled = done !== total;
  }
 
  check();
  document.getElementById('submitBtn').addEventListener('click', () => submitForm(branch, slug, state));
}
 
/* ---------- ENVÍO ---------- */
async function submitForm(branch, slug, state){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Enviando…';
  document.getElementById('errSlot').innerHTML = '';
 
  const fd = new FormData();
  const unidades = state.map(s => {
    const foto = 'foto_' + s.key;
    fd.append(foto, s.foto, foto + '.jpg');
    return {
      id: s.key,
      origen: s.origen,
      eco: s.eco.trim().toUpperCase(),
      tipo: s.tipo,
      modelo: s.modelo || '',
      marca: (s.marca || '').trim(),
      serie: (s.serie || '').trim(),
      placa: (s.placa || s.placa_nueva || '').trim().toUpperCase(),
      placa_pendiente: s.origen === 'LISTADA' && !s.placa,
      tipo_tarjeta: s.ctipo === 'DRIVETAG' ? 'DRIVETAG' : 'TICKET CAR',
      tarjeta: fmtCard(s.tarjeta),
      comentario: s.comentario.trim(),
      foto
    };
  });
  fd.append('sucursal', slug);
  fd.append('sucursal_nombre', branch.nombre);
  fd.append('acepto_instrucciones', aceptacion || '');
  fd.append('payload', JSON.stringify({ unidades }));
 
  try {
    const res = await fetch(WEBHOOK_URL, { method: 'POST', body: fd });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    renderSuccess(branch.nombre, unidades);
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Enviar tarjetas';
    document.getElementById('errSlot').innerHTML = `<div class="err-banner">No se pudo conectar con el servidor (${esc(err.message)}). Tus datos y fotos siguen aquí: revisa tu conexión y vuelve a pulsar <b>Enviar tarjetas</b>.</div>`;
  }
}
 
function renderSuccess(nombre, us){
  const add = us.filter(u => u.origen === 'AGREGADA').length;
  app.innerHTML = `
    <div class="wrap center-screen">
      <div class="ok-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#4FA6A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>Tarjetas enviadas</h1>
      <p>Gracias. Se registraron las tarjetas de combustible de <b>${esc(nombre)}</b>.</p>
      <div class="summary">
        <div>Unidades reportadas <b>${us.length}</b></div>
        <div>Unidades agregadas <b>${add}</b></div>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
</script>
